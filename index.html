<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirectPath = params.get("redirect");

        if (!redirectPath) return;

        var normalizedPath = redirectPath.startsWith("/") ? redirectPath : "/" + redirectPath;
        window.history.replaceState(null, "", normalizedPath + window.location.hash);
      })();
    </script>

    <!-- favicon -->
    <link rel="icon" href="/favicon.ico?v=8" />

    <!-- Mux player warm-up -->
    <link rel="preconnect" href="https://player.mux.com" crossorigin />
    <link rel="preconnect" href="https://stream.mux.com" crossorigin />
    <link rel="preconnect" href="https://image.mux.com" crossorigin />

    <!-- SEO -->
    <title>Artevent Production | Video Corporate, Riprese Drone e Fotografia</title>

    <meta
      id="meta-description"
      name="description"
      content="Artevent Production realizza video corporate, riprese drone e fotografia professionale per aziende, brand, hospitality ed eventi."
    />
    <meta name="author" content="Artevent Production" />
    <meta id="meta-robots" name="robots" content="index, follow" />
    <link id="canonical-link" rel="canonical" href="https://www.arteventproduction.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta id="og-title" property="og:title" content="Artevent Production | Video Corporate, Riprese Drone e Fotografia" />
    <meta
      id="og-description"
      property="og:description"
      content="Artevent Production realizza video corporate, riprese drone e fotografia professionale per aziende, brand, hospitality ed eventi."
    />
    <meta id="og-url" property="og:url" content="https://www.arteventproduction.com/" />
    <meta id="og-image" property="og:image" content="https://www.arteventproduction.com/images/og-share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:site_name" content="Artevent Production" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta id="twitter-title" name="twitter:title" content="Artevent Production | Video Corporate, Riprese Drone e Fotografia" />
    <meta
      id="twitter-description"
      name="twitter:description"
      content="Artevent Production realizza video corporate, riprese drone e fotografia professionale per aziende, brand, hospitality ed eventi."
    />
    <meta id="twitter-image" name="twitter:image" content="https://www.arteventproduction.com/images/og-share-card.png" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
